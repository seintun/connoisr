version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:30'
      timezone: 'UTC'
    open-pull-requests-limit: 5

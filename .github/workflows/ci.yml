name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      full_e2e:
        description: 'Run full Playwright matrix (Chromium + Mobile emulation)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - "app/**"
              - "components/**"
              - "context/**"
              - "hooks/**"
              - "lib/**"
              - "tests/e2e/**"
              - "playwright.config.ts"
              - "package.json"
              - "package-lock.json"

  quality:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:architecture
      - run: npm run test:docs
      - run: npm run test:coverage

  e2e_pr_chromium:
    if: github.event_name == 'pull_request' && needs.changes.outputs.ui == 'true'
    needs: [changes, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:chromium -- --max-failures=1
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-e2e_pr_chromium
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e_push_smoke:
    if: github.event_name == 'push' && needs.changes.outputs.ui == 'true'
    needs: [changes, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-e2e_push_smoke
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e_nightly_full:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.full_e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:full
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-e2e_nightly_full
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
